<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dust & Iron - Western 3D</title>

<!-- THREE.JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#start{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
        rgba(100,55,20,.35),
        rgba(0,0,0,.95));
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:20;
    text-align:center;
}

#start h1{
    font-size:70px;
    letter-spacing:10px;
    margin:0;
    color:#e5b36a;
    text-shadow:0 5px 20px black;
}

#start p{
    font-size:18px;
    color:#ddd;
    margin:15px;
}

#play{
    padding:18px 45px;
    font-size:20px;
    font-weight:bold;
    background:#8b4c20;
    border:2px solid #d89b55;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

#play:hover{
    background:#b86b2c;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#stats{
    position:absolute;
    left:20px;
    bottom:20px;
    width:240px;
}

.bar{
    width:240px;
    height:16px;
    background:rgba(0,0,0,.65);
    border:1px solid white;
    margin-top:5px;
}

.fill{
    height:100%;
    width:100%;
}

#healthFill{
    background:#b52c25;
}

#staminaFill{
    background:#d6a83c;
}

#deadFill{
    background:#6090d8;
}

.label{
    font-size:12px;
    margin-top:6px;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:25px;
    font-size:25px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#mission{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
    text-align:center;
    text-shadow:2px 2px 5px black;
}

#wanted{
    position:absolute;
    top:25px;
    right:25px;
    font-size:22px;
    color:#f0d18b;
}

#message{
    position:absolute;
    bottom:130px;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
    text-align:center;
    text-shadow:2px 2px 5px black;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
}

#crosshair:after{
    height:2px;
    width:20px;
    top:9px;
}

#prompt{
    position:absolute;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    font-size:16px;
    text-shadow:2px 2px 5px black;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="start">

    <h1>DUST & IRON</h1>

    <p>
        A 3D western frontier
    </p>

    <p>
        <b>Press ENTER</b> or click below
    </p>

    <button id="play">
        ENTER THE FRONTIER
    </button>

</div>

<!-- HUD -->
<div id="hud">

    <div id="mission">
        Mission: Ride into town and speak with the sheriff
    </div>

    <div id="wanted">
        Wanted: ☆☆☆☆☆
    </div>

    <div id="stats">

        <div class="label">HEALTH</div>
        <div class="bar">
            <div id="healthFill" class="fill"></div>
        </div>

        <div class="label">STAMINA</div>
        <div class="bar">
            <div id="staminaFill" class="fill"></div>
        </div>

        <div class="label">DEAD EYE</div>
        <div class="bar">
            <div id="deadFill" class="fill"></div>
        </div>

    </div>

    <div id="ammo">
        6 / 36
    </div>

    <div id="message"></div>

    <div id="prompt"></div>

    <div id="crosshair"></div>

</div>

<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let horse;

let enemies = [];
let npcs = [];
let bullets = [];

let gameStarted = false;
let paused = false;

let keys = {};

let mouseX = 0;
let mouseY = 0;

let cameraYaw = 0;
let cameraPitch = 0;

let ammo = 6;
let reserveAmmo = 36;

let reloading = false;
let reloadTimer = 0;

let messageTimer = 0;

let timeOfDay = 0;

let game = {

    health:100,
    stamina:100,
    deadEye:100,
    wanted:0,
    dead:false

};

/* =========================================================
   INIT
========================================================= */

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x87b6d9);

    scene.fog =
        new THREE.Fog(0x87b6d9,80,500);

    clock = new THREE.Clock();

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth/window.innerHeight,
            .1,
            1000
        );

    camera.position.set(
        0,
        4,
        15
    );

    createLights();

    createWorld();

    createPlayer();

    createHorse();

    createTown();

    createNPCs();

    createEnemies();

    setupInput();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}

/* =========================================================
   LIGHTING
========================================================= */

function createLights(){

    const sun =
        new THREE.DirectionalLight(
            0xffdfaa,
            2
        );

    sun.position.set(
        100,
        150,
        80
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    scene.add(sun);

    const ambient =
        new THREE.HemisphereLight(
            0x9cc9ff,
            0x5b3b20,
            1.2
        );

    scene.add(ambient);
}

/* =========================================================
   WORLD
========================================================= */

function createWorld(){

    const groundGeometry =
        new THREE.PlaneGeometry(
            1000,
            1000,
            50,
            50
        );

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color:0x9a7042,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.rotation.x =
        -Math.PI/2;

    ground.receiveShadow = true;

    scene.add(ground);

    createMountains();

    createRocks();

    createCacti();
}

/* =========================================================
   MOUNTAINS
========================================================= */

function createMountains(){

    for(let i=0;i<25;i++){

        const height =
            30 + Math.random()*60;

        const radius =
            20 + Math.random()*30;

        const geometry =
            new THREE.ConeGeometry(
                radius,
                height,
                7
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x5b4638,
                roughness:1
            });

        const mountain =
            new THREE.Mesh(
                geometry,
                material
            );

        const angle =
            Math.random()*Math.PI*2;

        const distance =
            250 + Math.random()*180;

        mountain.position.set(
            Math.cos(angle)*distance,
            height/2,
            Math.sin(angle)*distance
        );

        mountain.castShadow = true;

        scene.add(mountain);
    }
}

/* =========================================================
   ROCKS
========================================================= */

function createRocks(){

    for(let i=0;i<100;i++){

        const geometry =
            new THREE.DodecahedronGeometry(
                .5+Math.random()*2
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x62513d
            });

        const rock =
            new THREE.Mesh(
                geometry,
                material
            );

        rock.position.set(
            (Math.random()-.5)*800,
            .5,
            (Math.random()-.5)*800
        );

        rock.rotation.set(
            Math.random(),
            Math.random(),
            Math.random()
        );

        rock.castShadow = true;

        scene.add(rock);
    }
}

/* =========================================================
   CACTI
========================================================= */

function createCacti(){

    for(let i=0;i<60;i++){

        const cactus =
            new THREE.Group();

        const material =
            new THREE.MeshStandardMaterial({
                color:0x3e6b36
            });

        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .45,
                    3,
                    8
                ),
                material
            );

        trunk.position.y=1.5;

        cactus.add(trunk);

        if(Math.random()>.3){

            const arm =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .25,
                        .3,
                        1.5,
                        8
                    ),
                    material
                );

            arm.position.set(
                .7,
                1.8,
                0
            );

            arm.rotation.z =
                Math.PI/2;

            cactus.add(arm);
        }

        cactus.position.set(
            (Math.random()-.5)*500,
            0,
            (Math.random()-.5)*500
        );

        scene.add(cactus);
    }
}

/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

    player =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                1.8,
                .7
            ),
            new THREE.MeshStandardMaterial({
                color:0x3c2415
            })
        );

    body.position.y=1;

    body.castShadow=true;

    player.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .45,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xc58b61
            })
        );

    head.position.y=2.2;

    head.castShadow=true;

    player.add(head);

    player.position.set(
        0,
        0,
        110
    );

    scene.add(player);
}

/* =========================================================
   HORSE
========================================================= */

function createHorse(){

    horse =
        new THREE.Group();

    const brown =
        new THREE.MeshStandardMaterial({
            color:0x4a2817
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                1.4,
                4
            ),
            brown
        );

    body.position.y=1.5;

    body.castShadow=true;

    horse.add(body);

    const neck =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            brown
        );

    neck.position.set(
        0,
        2.5,
        -1.4
    );

    neck.rotation.x=-.25;

    horse.add(neck);

    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .8,
                1.2
            ),
            brown
        );

    head.position.set(
        0,
        3.3,
        -1.9
    );

    horse.add(head);

    horse.position.set(
        4,
        0,
        105
    );

    scene.add(horse);
}

/* =========================================================
   TOWN
========================================================= */

function createTown(){

    for(let x=-30;x<=30;x+=15){

        createBuilding(
            x,
            -10
        );

        createBuilding(
            x,
            20
        );
    }

    const road =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                100,
                15
            ),
            new THREE.MeshStandardMaterial({
                color:0x69462c
            })
        );

    road.rotation.x=-Math.PI/2;

    road.position.set(
        0,
        .02,
        5
    );

    scene.add(road);
}

function createBuilding(x,z){

    const building =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                12,
                8,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x8b5d3b
            })
        );

    body.position.y=4;

    body.castShadow=true;

    building.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                13,
                1,
                11
            ),
            new THREE.MeshStandardMaterial({
                color:0x38251b
            })
        );

    roof.position.y=8.5;

    building.add(roof);

    building.position.set(
        x,
        0,
        z
    );

    scene.add(building);
}

/* =========================================================
   NPCS
========================================================= */

function createNPCs(){

    for(let i=0;i<8;i++){

        const npc =
            createPerson(
                0x35516b
            );

        npc.position.set(
            (Math.random()-.5)*60,
            0,
            (Math.random()-.5)*40
        );

        npc.userData.speed =
            .5+Math.random();

        npcs.push(npc);

        scene.add(npc);
    }
}

function createPerson(color){

    const person =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .8,
                1.5,
                .5
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y=.9;

    person.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xb87952
            })
        );

    head.position.y=1.9;

    person.add(head);

    return person;
}

/* =========================================================
   ENEMIES
========================================================= */

function createEnemies(){

    for(let i=0;i<5;i++){

        const enemy =
            createPerson(
                0x571c1c
            );

        enemy.position.set(
            40 + Math.random()*40,
            0,
            -20 + Math.random()*40
        );

        enemy.userData.health=100;
        enemy.userData.cooldown=0;

        enemies.push(enemy);

        scene.add(enemy);
    }
}

/* =========================================================
   INPUT
========================================================= */

function setupInput(){

    document.addEventListener(
        "keydown",
        function(e){

            keys[e.code]=true;

            /* ENTER STARTS GAME */

            if(e.code==="Enter"){

                if(!gameStarted){

                    startGame();

                    return;
                }

                if(game.dead){

                    respawnPlayer();

                    return;
                }
            }

            if(e.code==="Escape"){

                if(gameStarted){

                    paused=!paused;

                    showMessage(
                        paused ?
                        "Game paused" :
                        "Game resumed"
                    );
                }
            }

            if(e.code==="KeyR"){

                reload();
            }

            if(e.code==="KeyE"){

                mountHorse();
            }

            if(e.code==="KeyQ"){

                if(game.deadEye>10){

                    game.deadEye-=10;

                    showMessage(
                        "DEAD EYE"
                    );
                }
            }

            if(e.code==="Space"){

                jump();
            }
        }
    );

    document.addEventListener(
        "keyup",
        function(e){

            keys[e.code]=false;
        }
    );

    document.addEventListener(
        "mousemove",
        function(e){

            if(
                document.pointerLockElement ===
                renderer.domElement
            ){

                cameraYaw -= e.movementX*.002;

                cameraPitch -= e.movementY*.002;

                cameraPitch =
                    Math.max(
                        -.7,
                        Math.min(
                            .7,
                            cameraPitch
                        )
                    );
            }
        }
    );

    document.addEventListener(
        "mousedown",
        function(e){

            if(
                gameStarted &&
                !game.dead &&
                !paused &&
                e.button===0
            ){

                shoot();
            }
        }
    );

    document.getElementById(
        "play"
    ).addEventListener(
        "click",
        startGame
    );
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    if(gameStarted) return;

    gameStarted=true;

    document.getElementById(
        "start"
    ).style.display="none";

    if(renderer.domElement.requestPointerLock){

        renderer.domElement.requestPointerLock();
    }

    showMessage(
        "Welcome to the frontier."
    );
}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    if(game.dead) return;

    let speed=10;

    if(keys["ShiftLeft"] ||
       keys["ShiftRight"]){

        speed=18;

        game.stamina -=
            20*dt;

    }else{

        game.stamina +=
            10*dt;
    }

    game.stamina =
        THREE.MathUtils.clamp(
            game.stamina,
            0,
            100
        );

    const forward =
        new THREE.Vector3(
            Math.sin(cameraYaw),
            0,
            Math.cos(cameraYaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(cameraYaw),
            0,
            -Math.sin(cameraYaw)
        );

    if(keys["KeyW"]){

        player.position.addScaledVector(
            forward,
            speed*dt
        );
    }

    if(keys["KeyS"]){

        player.position.addScaledVector(
            forward,
            -speed*dt
        );
    }

    if(keys["KeyA"]){

        player.position.addScaledVector(
            right,
            speed*dt
        );
    }

    if(keys["KeyD"]){

        player.position.addScaledVector(
            right,
            -speed*dt
        );
    }

    player.position.y=0;
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=10;

    const height=5;

    camera.position.x =
        player.position.x -
        Math.sin(cameraYaw)*distance;

    camera.position.z =
        player.position.z -
        Math.cos(cameraYaw)*distance;

    camera.position.y =
        player.position.y +
        height -
        cameraPitch*4;

    const target =
        player.position.clone();

    target.y+=1.5;

    camera.lookAt(target);
}

/* =========================================================
   HORSE
========================================================= */

function mountHorse(){

    if(
        player.position.distanceTo(
            horse.position
        )<6
    ){

        player.position.copy(
            horse.position
        );

        showMessage(
            "You mounted your horse."
        );

    }else{

        showMessage(
            "Your horse is too far away."
        );
    }
}

/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(player.position.y===0){

        player.position.y=.2;

        setTimeout(
            function(){

                player.position.y=0;

            },
            250
        );
    }
}

/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(reloading) return;

    if(ammo<=0){

        showMessage(
            "Out of ammo. Press R."
        );

        return;
    }

    ammo--;

    updateHUD();

    const bullet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .08,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffd37a
            })
        );

    bullet.position.copy(
        camera.position
    );

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    bullet.userData.velocity =
        direction.multiplyScalar(80);

    bullet.userData.life=2;

    bullets.push(bullet);

    scene.add(bullet);
}

/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=bullets[i];

        bullet.position.addScaledVector(
            bullet.userData.velocity,
            dt
        );

        bullet.userData.life-=dt;

        for(
            let j=0;
            j<enemies.length;
            j++
        ){

            const enemy=enemies[j];

            if(
                bullet.position.distanceTo(
                    enemy.position
                )<2
            ){

                enemy.userData.health-=50;

                scene.remove(bullet);

                bullets.splice(i,1);

                game.wanted=
                    Math.min(
                        5,
                        game.wanted+1
                    );

                if(
                    enemy.userData.health<=0
                ){

                    scene.remove(enemy);

                    enemies.splice(j,1);

                    showMessage(
                        "Enemy down."
                    );
                }

                break;
            }
        }

        if(
            bullet.userData.life<=0
        ){

            scene.remove(bullet);

            bullets.splice(i,1);
        }
    }
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(reloading) return;

    if(ammo>=6) return;

    if(reserveAmmo<=0){

        showMessage(
            "No reserve ammunition."
        );

        return;
    }

    reloading=true;

    reloadTimer=1.5;

    showMessage(
        "Reloading..."
    );
}

function updateReload(dt){

    if(!reloading) return;

    reloadTimer-=dt;

    if(reloadTimer<=0){

        const needed =
            6-ammo;

        const amount =
            Math.min(
                needed,
                reserveAmmo
            );

        ammo+=amount;

        reserveAmmo-=amount;

        reloading=false;

        showMessage(
            "Reloaded."
        );

        updateHUD();
    }
}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

    for(
        const enemy of enemies
    ){

        const distance =
            enemy.position.distanceTo(
                player.position
            );

        if(distance<50){

            enemy.lookAt(
                player.position.x,
                enemy.position.y,
                player.position.z
            );

            if(distance>10){

                const direction =
                    player.position.clone()
                    .sub(enemy.position)
                    .normalize();

                enemy.position.addScaledVector(
                    direction,
                    dt*2
                );
            }

            enemy.userData.cooldown-=dt;

            if(
                distance<30 &&
                enemy.userData.cooldown<=0
            ){

                enemy.userData.cooldown=2;

                game.health-=10;

                showMessage(
                    "You were shot!"
                );

                if(game.health<=0){

                    die();
                }
            }
        }
    }
}

/* =========================================================
   NPC AI
========================================================= */

function updateNPCs(dt){

    for(
        const npc of npcs
    ){

        npc.rotation.y +=
            Math.sin(
                performance.now()*.001
            )*.001;

        if(
            Math.random()<.002
        ){

            npc.userData.direction =
                Math.random()*Math.PI*2;
        }

        if(
            npc.userData.direction!==undefined
        ){

            npc.position.x +=
                Math.sin(
                    npc.userData.direction
                ) *
                npc.userData.speed *
                dt;

            npc.position.z +=
                Math.cos(
                    npc.userData.direction
                ) *
                npc.userData.speed *
                dt;
        }
    }
}

/* =========================================================
   DEATH / RESPAWN
========================================================= */

function die(){

    if(game.dead) return;

    game.dead=true;

    showMessage(
        "You died. Press ENTER to respawn."
    );
}

function respawnPlayer(){

    game.health=100;

    game.stamina=100;

    game.deadEye=100;

    game.wanted=0;

    game.dead=false;

    player.position.set(
        0,
        0,
        110
    );

    showMessage(
        "You returned to the frontier."
    );
}

/* =========================================================
   STATS
========================================================= */

function updateStats(dt){

    game.deadEye +=
        5*dt;

    game.deadEye =
        Math.min(
            100,
            game.deadEye
        );

    game.health =
        Math.min(
            100,
            game.health
        );
}

/* =========================================================
   WANTED
========================================================= */

function updateWanted(dt){

    if(game.wanted>0){

        game.wanted -=
            .08*dt;

        game.wanted =
            Math.max(
                0,
                game.wanted
            );
    }
}

/* =========================================================
   TIME
========================================================= */

function updateTime(dt){

    timeOfDay +=
        dt*.002;

    const cycle =
        Math.sin(timeOfDay);

    const sky =
        new THREE.Color();

    sky.setHSL(
        .58,
        .45,
        .55 + cycle*.1
    );

    scene.background=sky;

    scene.fog.color.copy(
        sky
    );
}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const element =
        document.getElementById(
            "message"
        );

    element.textContent=text;

    messageTimer=3;
}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";
        }
    }
}

/* =========================================================
   PROMPT
========================================================= */

function updatePrompt(){

    const distance =
        player.position.distanceTo(
            horse.position
        );

    if(distance<6){

        document.getElementById(
            "prompt"
        ).textContent=
            "E - Mount Horse";

    }else{

        document.getElementById(
            "prompt"
        ).textContent=
            "";
    }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "healthFill"
    ).style.width =
        game.health+"%";

    document.getElementById(
        "staminaFill"
    ).style.width =
        game.stamina+"%";

    document.getElementById(
        "deadFill"
    ).style.width =
        game.deadEye+"%";

    document.getElementById(
        "ammo"
    ).textContent =
        ammo+" / "+reserveAmmo;

    let stars="";

    const wanted =
        Math.round(
            game.wanted
        );

    for(let i=0;i<5;i++){

        stars +=
            i<wanted ? "★" : "☆";
    }

    document.getElementById(
        "wanted"
    ).textContent =
        "Wanted: "+stars;
}

/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect =
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        gameStarted &&
        !paused
    ){

        updatePlayer(dt);

        updateCamera(dt);

        updateBullets(dt);

        updateEnemies(dt);

        updateNPCs(dt);

        updateReload(dt);

        updateStats(dt);

        updateWanted(dt);

        updateTime(dt);

        updateMessage(dt);

        updatePrompt();

        updateHUD();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
