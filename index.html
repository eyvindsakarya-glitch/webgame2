<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge the Meteors 🚀</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #09091a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: 500px;
      height: 700px;
      max-width: 95vw;
      max-height: 90vh;
      overflow: hidden;
      border: 3px solid #5c5cff;
      border-radius: 15px;
      background:
        radial-gradient(circle at 20% 20%, #ffffff 1px, transparent 2px),
        radial-gradient(circle at 80% 60%, #ffffff 1px, transparent 2px),
        radial-gradient(circle at 40% 90%, #ffffff 1px, transparent 2px),
        #10102d;
      background-size: 120px 120px, 180px 180px, 250px 250px;
      box-shadow: 0 0 40px #4c4cff55;
    }

    #player {
      position: absolute;
      bottom: 25px;
      left: 225px;
      width: 50px;
      height: 50px;
      font-size: 42px;
      line-height: 50px;
      text-align: center;
      user-select: none;
    }

    .meteor {
      position: absolute;
      width: 42px;
      height: 42px;
      font-size: 38px;
      line-height: 42px;
      text-align: center;
      user-select: none;
    }

    #score {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
      z-index: 10;
    }

    #gameOver {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000bb;
      text-align: center;
      z-index: 20;
    }

    #gameOver h1 {
      font-size: 48px;
      margin: 0 0 10px;
      color: #ff5c8a;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #5c5cff;
      color: white;
    }

    button:hover {
      background: #7777ff;
    }

    #hint {
      position: absolute;
      bottom: 8px;
      width: 100%;
      text-align: center;
      opacity: 0.5;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div id="game">
  <div id="score">Score: 0</div>
  <div id="player">🚀</div>
  <div id="hint">Use ← → to move</div>

  <div id="gameOver">
    <h1>💥 BOOM!</h1>
    <div id="finalScore"></div>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
  const game = document.getElementById("game");
  const player = document.getElementById("player");
  const scoreText = document.getElementById("score");
  const gameOverScreen = document.getElementById("gameOver");
  const finalScore = document.getElementById("finalScore");

  let playerX = 225;
  let score = 0;
  let speed = 3;
  let gameRunning = true;
  let keys = {};

  document.addEventListener("keydown", e => {
    keys[e.key] = true;
  });

  document.addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  function movePlayer() {
    if (!gameRunning) return;

    if (keys["ArrowLeft"]) {
      playerX -= 7;
    }

    if (keys["ArrowRight"]) {
      playerX += 7;
    }

    playerX = Math.max(0, Math.min(game.clientWidth - 50, playerX));
    player.style.left = playerX + "px";
  }

  function createMeteor() {
    if (!gameRunning) return;

    const meteor = document.createElement("div");
    meteor.className = "meteor";
    meteor.textContent = "☄️";

    const x = Math.random() * (game.clientWidth - 42);
    let y = -50;

    meteor.style.left = x + "px";
    meteor.style.top = y + "px";
    game.appendChild(meteor);

    function fall() {
      if (!gameRunning) {
        meteor.remove();
        return;
      }

      y += speed;
      meteor.style.top = y + "px";

      // Collision detection
      const p = player.getBoundingClientRect();
      const m = meteor.getBoundingClientRect();

      if (
        p.left < m.right &&
        p.right > m.left &&
        p.top < m.bottom &&
        p.bottom > m.top
      ) {
        endGame();
        return;
      }

      // Meteor escaped
      if (y > game.clientHeight) {
        meteor.remove();
        score++;
        scoreText.textContent = "Score: " + score;

        // Gradually increase difficulty
        if (score % 10 === 0) {
          speed += 0.5;
        }

        return;
      }

      requestAnimationFrame(fall);
    }

    requestAnimationFrame(fall);
  }

  function endGame() {
    gameRunning = false;

    finalScore.textContent = `You survived with a score of ${score}!`;
    gameOverScreen.style.display = "flex";
  }

  function restartGame() {
    document.querySelectorAll(".meteor").forEach(m => m.remove());

    playerX = 225;
    score = 0;
    speed = 3;
    gameRunning = true;

    player.style.left = playerX + "px";
    scoreText.textContent = "Score: 0";
    gameOverScreen.style.display = "none";

    gameLoop();
  }

  function gameLoop() {
    if (!gameRunning) return;

    movePlayer();
    requestAnimationFrame(gameLoop);
  }

  // Spawn meteors
  setInterval(() => {
    if (gameRunning) {
      createMeteor();
    }
  }, 700);

  gameLoop();
</script>

</body>
</html>
